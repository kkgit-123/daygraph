[app]
host = 0.0.0.0
port = 8000
url_prefix = /api


[paths]
database_file = database.db


[daygraph]
; mock = no network, deterministic fixtures (default). live = real Google / Gemini.
google_mode = mock
llm_mode = mock
frontend_origins = http://localhost:3005,http://127.0.0.1:3005,http://localhost:3009,http://127.0.0.1:3009
jwt_expiry_seconds = 28800
; the "current moment" in mock mode (the seeded story happens on this morning)
mock_now = 2026-10-09T10:15:00+09:00
timezone = Asia/Tokyo
workspace_name = Payments launch
workspace_subtitle = 5 people in 5 cities
undo_window_minutes = 10
; link saving: live mode fetches the page (safe fetcher); mock mode never touches the network
link_fetch_timeout_s = 15
link_max_bytes = 5242880
link_max_redirects = 5

[security]
; Signs login tokens (HS256). Leave empty for mock mode (a dev-only secret is used).
; Live mode needs a value here or the JWT_SECRET environment variable. Never commit a real value.
jwt_secret = 
; Fernet key that encrypts stored Google refresh tokens (live mode, DG-L02).
; Generate one: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
fernet_key = 

[google_oauth]
; OAuth client from Google Cloud Console > APIs & Services > Credentials (type: Web application).
client_id = 
client_secret = 
; must match an authorised redirect URI on that client
redirect_uri = http://localhost:5555/api/auth/google/callback
; where the browser goes after Google sign-in (the React app)
frontend_url = http://localhost:3005
; Workspace domain allowed to sign in (empty = any domain, not recommended)
allowed_domain = 

[gcp]
; Google Cloud project used for Vertex AI (Gemini) and Pub/Sub (Workspace Events webhook)
project_id = 
location = us-central1
; true = call Gemini through Vertex AI with the project above instead of the API key below
use_vertex = false
; Pub/Sub topic that Workspace Events publishes to, and the push subscription's OIDC audience (DG-L06)
pubsub_topic = 
; service account email Pub/Sub pushes as (optional, recommended)
pubsub_service_account = 
pubsub_audience = 


[gemini]
; API key from AI Studio. Not needed when [gcp] use_vertex = true.
temperature = 0.2
max_output_tokens = 8000
api_key = 
model = gemini-2.5-flash
pro_model = gemini-2.5-pro
embedding_model = gemini-embedding-001
max_file_size = 28
max_retries = 3
; Gemini calls allowed per UTC day in this process (DG-L01 budget)
daily_call_budget = 5000


[bot]
retrieve_docs = 10
max_questions_to_consider = 20
