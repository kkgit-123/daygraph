<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B1020" />
    <meta name="description" content="DayGraph: your day, intelligently orchestrated." />
    <title>DayGraph</title>
    <script>
      /* Apply the saved theme before first paint so the wrong theme never flashes. */
      (function () {
        var mode = 'dark';
        try { mode = localStorage.getItem('dg-theme') || 'dark'; } catch (e) { /* storage blocked */ }
        var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
